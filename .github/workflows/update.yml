name: Update Vavoo M3U

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Deponu kopyala
      uses: actions/checkout@v4

    - name: Python mühitini qur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Skripti icra et
      run: python fetch_vavoo.py

    - name: M3U faylını GitHub-a yüklə
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add vavoo_tr.m3u
        git commit -m "Auto-update Vavoo TR list" || exit 0
        git push
